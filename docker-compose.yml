# ============================================================================
# docker-compose — ambiente de desenvolvimento do AegisPass (INFRA-003/004)
# ----------------------------------------------------------------------------
# Didatico: o compose descreve varios servicos (containers) e como se ligam.
# Corre tudo com:  docker compose up --build
# As variaveis vem do ficheiro .env (copia de .env.example).
# ============================================================================

services:
  # --- Base de dados PostgreSQL --------------------------------------------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Persiste os dados entre reinicios. A pasta ./pgdata esta no .gitignore.
      - ./pgdata:/var/lib/postgresql/data
      # Backups cifrados (.enc) ficam em ./backups (ver scripts/ e cmd/backup).
    healthcheck:
      # pg_isready confirma que o Postgres aceita ligacoes antes de marcar
      # o servico como "healthy" (o backend espera por isto).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- API backend (Go) ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AEGIS_HTTP_ADDR: ":8080"
      AEGIS_MTLS_ADDR: ":8443"
      AEGIS_MTLS_AUTO_DEV: "true"
      # Dentro da rede do compose, o host da BD e o nome do servico: "db".
      AEGIS_DATABASE_URL: "postgres://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-aegis}?sslmode=disable"
      # Chave admin para /api/admin/* (dev). Em produção: valor longo e aleatório no .env.
      AEGIS_ADMIN_KEY: ${AEGIS_ADMIN_KEY:-dev-admin-change-me}
      # MAIL-002 (dev): URL interna do Mailpit para buscar corpo completo das mensagens.
      AEGIS_MAILPIT_URL: "http://mailpit:8025"
      AEGIS_MAIL_WEBHOOK_SECRET: ${AEGIS_MAIL_WEBHOOK_SECRET:-dev-mail-webhook-secret}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${BACKEND_MTLS_PORT:-8443}:8443"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # --- Mailpit (SMTP de desenvolvimento — MAIL-002) ------------------------
  # Didático: Mailpit apanha e-mail SMTP sem enviar para a Internet real.
  # UI: http://localhost:8025  ·  SMTP: localhost:1025
  # Webhook notifica o backend quando chega mensagem para um alias @aegis.email.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    command:
      - --smtp=0.0.0.0:1025
      - --listen=0.0.0.0:8025
      - --webhook-url=http://backend:8080/api/mail/webhook/mailpit?secret=${AEGIS_MAIL_WEBHOOK_SECRET:-dev-mail-webhook-secret}
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
